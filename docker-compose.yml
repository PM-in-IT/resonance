services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - .:/app
      - resonance-data:/data
    ports:
      - "8000:8000"
    depends_on: [postgres, redis]

  worker:
    build: .
    command: rq worker media --url redis://redis:6379/0
    env_file: .env
    volumes:
      - .:/app
      - resonance-data:/data
    depends_on: [postgres, redis]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: resonance
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  resonance-data:
